services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: cyber_garden
      POSTGRES_PASSWORD: cyber_garden_dev
      POSTGRES_DB: cyber_garden
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "cyber_garden", "-d", "cyber_garden"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
